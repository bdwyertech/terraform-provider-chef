# This GitHub action runs your tests for each commit push and/or PR. Optionally
# you can turn it on using a cron schedule for regular testing.
#
name: Tests
concurrency: test
on:
  pull_request:
    paths-ignore:
      - 'README.md'
  push:
    paths-ignore:
      - 'README.md'
  # For systems with an upstream API that could drift unexpectedly (like most SaaS systems, etc.),
  # we recommend testing at a regular interval not necessarily tied to code changes. This will
  # ensure you are alerted to something breaking due to an API change, even if the code did not
  # change.
  # schedule:
  #   - cron: '0 13 * * *'
jobs:
  # ensure the code builds...
  build:
    name: Build & Lint
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out code into the Go module directory
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: '1.25'
          cache: true
          check-latest: true

      - name: Test & Build
        env:
          GOFLAGS: '-mod=vendor'
        run: |
          git config --global --add safe.directory $GITHUB_WORKSPACE
          go fmt $(go list ./... | grep -v /vendor/) | xargs -I {} -r /bin/sh -c "/bin/echo {} && exit 1"
          go vet $(go list ./... | grep -v /vendor/)
          go test -v -race $(go list ./... | grep -v /vendor/)
          go build .

      - name: Static Analysis
        uses: dominikh/staticcheck-action@v1
        with:
          version: 'latest'

  # run acceptance tests in a matrix with Terraform core versions
  test:
    name: Matrix Test
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        # list whatever Terraform versions here you would like to support
        terraform:
          - '0.12.*'
          - '0.13.*'
          - '0.14.*'
          - '0.15.*'
          - '1.0.*'
          - '1.1.*'
          - '1.2.*'
          - '1.3.*'
          - '1.4.*'
          - '1.5.*'
          - '1.6.*'
          - '1.7.*'
          - '1.8.*'
          - '1.9.*'
    steps:
      - name: Check out code into the Go module directory
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: '1.25'
          cache: true
          check-latest: true
        id: go

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ matrix.terraform }}
          terraform_wrapper: false

      # Random sleep so acceptance tests do not collide creating objects on Chef Server
      # - name: Wait
      #   uses: 1itachi/sleep-random@v1.0.0
      #   with:
      #     minutes: '2'
      #     random: 'true'

      - name: TF acceptance tests
        timeout-minutes: 10
        env:
          GOFLAGS: '-mod=vendor'
          TF_ACC: '1'
          CHEF_SERVER_URL: ${{ secrets.CHEF_SERVER_URL }}
          CHEF_CLIENT_NAME: ${{ secrets.CHEF_CLIENT_NAME }}
          CHEF_KEY_MATERIAL: ${{ secrets.CHEF_KEY_MATERIAL }}

        run: |
          go test -v -cover ./internal/provider/
